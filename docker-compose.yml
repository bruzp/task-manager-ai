services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: tma_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: php artisan serve --host=0.0.0.0 --port=8000

  node:
    image: node:22-alpine
    container_name: tma_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: tma_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tmadb
      MYSQL_USER: tmauser
      MYSQL_PASSWORD: tmapassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/db/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tma_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

  ollama:
    image: ollama/ollama:latest
    container_name: tma_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    container_name: tma_ollama_pull
    restart: "no"
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for Ollama to be ready...';
        sleep 5;
        ollama pull qwen2.5:0.5b;
        echo 'Model ready.'
      "
    environment:
      OLLAMA_HOST: http://ollama:11434

volumes:
  mysql_data:
  ollama_data: